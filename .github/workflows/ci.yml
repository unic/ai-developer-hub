name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Stub env vars required for Next.js build — no real credentials needed
      DATABASE_URL: "postgresql://user:pass@localhost/ci?sslmode=require"
      DATABASE_URL_UNPOOLED: "postgresql://user:pass@localhost/ci?sslmode=require"
      AUTH_SECRET: "ci-stub-secret-at-least-32-characters-long"
      NEXTAUTH_URL: "http://localhost:3000"
      API_KEY_ENCRYPTION_SECRET: "ci-stub-encryption-secret-32bytes="
      CLOUDFLARE_R2_ACCOUNT_ID: "ci-stub"
      CLOUDFLARE_R2_ACCESS_KEY_ID: "ci-stub"
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: "ci-stub"
      CLOUDFLARE_R2_BUCKET_NAME: "ci-stub"
      ANTHROPIC_API_KEY: "ci-stub"
      ANTHROPIC_ADMIN_API_KEY: "ci-stub"
      CRON_SECRET: "ci-stub-cron-secret"
      RESEND_API_KEY: "re_ci_stub"
      FROM_EMAIL: "noreply@ci.example.com"
      INVOICE_INGEST_SECRET: "ci-stub"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

